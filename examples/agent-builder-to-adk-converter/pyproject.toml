[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-builder-to-adk"
version = "1.0.0"
description = "Enterprise Google Cloud Agent Builder to Google ADK Python Converter"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Google Cloud Professional Services", email = "google-cloud-pso@google.com"}
]
keywords = [
    "google-cloud",
    "agent-builder",
    "adk",
    "antigravity",
    "llm",
    "workflow-migration"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "flake8>=6.1.0",
    "black>=23.9.0",
]
webapp = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]

[project.scripts]
agent-builder-to-adk = "agent_builder_to_adk.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_builder_to_adk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312", "py313"]

[tool.coverage.run]
source = ["agent_builder_to_adk"]
omit = ["tests/*"]
