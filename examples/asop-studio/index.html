<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ASOP Studio is a professional node-based graph editor for designing, visualizing, and managing Agentic Standard Operating Procedures (SOPs)." />
    <title>ASOP Studio — Agentic SOP Editor</title>
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('asop_theme');
          if (savedTheme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
