# Schema evolution utility - run configuration.
# Copy to config.yaml and edit:  cp config.example.yaml config.yaml
#
# Structure: projects -> datastores -> schema file.
# Option precedence: datastore entry > project entry > defaults.
# Relative schema_file paths are resolved against this file's folder.
# ${VAR} values are read from environment variables.

defaults:
  location: us                 # global | us | eu
  on_breaking: raise           # raise | skip
  recreate_if_empty: false     # delete + recreate schema for type changes, ONLY if datastore has 0 documents
  operation_timeout: 3600      # seconds to wait for each schema operation

projects:
  - project_id: ${DEV_PROJECT_ID}          # e.g. export DEV_PROJECT_ID=my-dev-project
    datastores:
      - datastore_id: journals-datastore
        schema_file: schemas/example_schema.json

      - datastore_id: abstracts-datastore
        schema_file: schemas/example_wrapped_schema.json
        schema_key: [abstracts_schema, fallback_schema]   # wrapper file: first key found is used
        on_breaking: skip                                 # override for this datastore only

      - datastore_id: old-datastore
        schema_file: schemas/example_schema.json
        enabled: false                                    # keep in config, skip during runs

  - project_id: my-prod-project
    location: global                       # project-level override
    datastores:
      - datastore_id: journals-datastore
        schema_file: schemas/example_schema.json
