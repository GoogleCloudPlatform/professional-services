[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "schema-evolution"
version = "0.1.0"
description = "Declarative schema evolution for Vertex AI Search / Gemini Enterprise datastores."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "google-cloud-discoveryengine>=0.11.0",
    "google-api-core>=2.11.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
schema-evolution = "schema_evolution.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/schema_evolution"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
